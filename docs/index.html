<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Emergency Info · 紧急信息</title>
<link rel="icon" href="data:,">
<!-- 共用文件带版本号：改了 shared.* 就把 v 加 1，避免浏览器用旧的缓存 -->
<link rel="stylesheet" href="shared.css?v=6">
<style>
  html, body { margin: 0; background: #fff; }
  .help { max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }
  .help .steps .en { display: block; color: #777; font-size: 13px; }
</style>
</head>
<body>
<div class="help" id="help"></div>
<script src="shared.js?v=6"></script>
<script>
// 求助页：资料只从网址 # 后面读取，# 后面的内容浏览器不会发给服务器
// 示例资料为虚构，电话使用 555-01xx 虚构号段
const DEMO_HASH = "1*WANG-LI*%E7%8E%8B%E4%B8%BD*M*HTN.DM*PCN*METFORMIN.AMLODIPINE*D6265550101MEI.S6265550102DAVID";

function show() {
  const el = document.getElementById("help");
  if (location.hash.length <= 1) {
    // 没有资料时是入口页：路人扫码打开的网址一定带 #资料，看不到这里；志愿者只要记住这个网址
    el.innerHTML = `
      <div class="alert"><b>Emergency Info</b><span>紧急信息</span></div>
      <p class="msg">This page shows a person's emergency information when opened from the QR code on their sticker.</p>
      <p class="msg zh">用手机相机扫描贴纸上的二维码，这里会显示长者的紧急资料。</p>
      <h2 class="hub-title">志愿者入口 · Volunteers</h2>
      <a class="hub" href="tool/"><b>📝 贴纸工具 · Sticker tool</b><span>录入资料、预览、打印贴纸<br>Enter info, preview and print stickers</span></a>
      <a class="hub" href="tool/?sheet"><b>🖨 打印测试页 · Print test</b><span>核对纸张对齐、测试扫码<br>Check label alignment and test scanning</span></a>
      <a class="hub" href="#${DEMO_HASH}"><b>👀 示例求助页 · Demo</b><span>扫码后路人看到的页面（虚构人物）<br>What people see after scanning (fictional person)</span></a>
      <h2 class="hub-title">现场流程 · How it works</h2>
      <ol class="steps">
        <li>打开贴纸工具，选模板（普通话 / 粤语 / 英语 / 西班牙语）<span class="en">Open the sticker tool and pick a template (Mandarin / Cantonese / English / Spanish)</span></li>
        <li>每位长者输入名字和电话，按 Enter 加入；人数不限，要多张就改份数<span class="en">Type each senior's name and phone number, then press Enter. No limit on people; change Copies if someone needs more than one</span></li>
        <li>打印所有待打印的人（每张 Avery 94230 印 10 张贴纸），打好后点"标记为已打印"<span class="en">Print everyone not yet printed (10 stickers per Avery 94230 sheet), then mark them as printed</span></li>
        <li>核对、贴好后，清空已打印的人<span class="en">After checking and applying the stickers, clear the printed people</span></li>
      </ol>`;
    return;
  }
  try {
    el.innerHTML = helpHTML(decode(location.hash));
  } catch {
    el.innerHTML = `
      <div class="alert"><b>Could not read this QR code</b><span>无法读取这个二维码</span></div>
      <p class="msg">Please call the emergency contact number printed on the sticker, or call 911.</p>
      <p class="msg zh">请拨打贴纸上印的紧急联系电话，或拨打 911。</p>
      ${centerHTML(SECOND.zh)}
      <a class="call e911" href="tel:911">📞 Call 911</a>`;
  }
}
show();
// 同一个分页里再扫另一张贴纸时，只有 # 变化，页面不会重新载入
window.addEventListener("hashchange", show);
</script>
</body>
</html>
